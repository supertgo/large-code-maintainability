name: Tests

on:
  push:
    branches: [ main, ferramenta, develop ]
  pull_request:
    branches: [ main, ferramenta, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-timeout coverage

    - name: Run unit tests
      run: |
        python -m pytest test_fix_analysis.py -v --tb=short --timeout=300

    - name: Generate coverage report
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: |
        coverage run -m pytest test_fix_analysis.py
        coverage report -m
        coverage html

    - name: Upload coverage to artifacts
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/

    - name: Test module imports
      run: |
        python -c "import fix_analysis; print('✓ fix_analysis imported successfully')"
        python -c "import quality_metrics_extension; print('✓ quality_metrics_extension imported successfully')"

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black pylint

    - name: Check code formatting with Black
      run: |
        black --check --diff fix_analysis.py quality_metrics_extension.py test_fix_analysis.py || true

    - name: Lint with flake8
      run: |
        flake8 fix_analysis.py quality_metrics_extension.py test_fix_analysis.py --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Extended linting with flake8
      run: |
        flake8 fix_analysis.py quality_metrics_extension.py test_fix_analysis.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify CodeShovel JAR exists
      run: |
        if [ -f "codeshovel.jar" ]; then
          echo "✓ CodeShovel JAR found"
          ls -lh codeshovel.jar
        else
          echo "⚠ CodeShovel JAR not found (expected for CI)"
        fi

    - name: Run example usage (if available)
      run: |
        if [ -f "example_usage.py" ]; then
          python example_usage.py --help || echo "Example usage script not fully functional"
        fi

    - name: Test CLI help
      run: |
        python fix_analysis.py --help || true

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Check for known vulnerabilities in dependencies
      run: |
        pip install -r requirements.txt
        safety check || true

    - name: Run Bandit security scanner
      run: |
        bandit -r fix_analysis.py quality_metrics_extension.py -f json -o bandit-report.json || true
        if [ -f "bandit-report.json" ]; then
          cat bandit-report.json
        fi

    - name: Upload security report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json
        if-no-files-found: ignore

