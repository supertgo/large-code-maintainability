name: Tests

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Display Python and pip versions
        run: |
          python --version
          pip --version

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y python3-dev || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-test.txt
          pip list
        continue-on-error: false

      - name: Verify imports
        run: |
          python -c "import sys; print('Python:', sys.version)"
          python -c "import pandas; print('pandas imported')"
          python -c "import numpy; print('numpy imported')"
          python -c "import pytest; print('pytest imported')"
          python -c "import matplotlib; print('matplotlib imported')"
          python -c "import seaborn; print(' seaborn imported')"

      - name: Run unit tests
        run: |
          python -m pytest test_fix_analysis.py -v --tb=long --timeout=300
        env:
          PYTHONDONTWRITEBYTECODE: 1

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          coverage run -m pytest test_fix_analysis.py
          coverage report -m
          coverage html

      - name: Upload coverage to artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      - name: Test module imports
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import test_fix_analysis; print('test_fix_analysis can be imported')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Check code formatting with Black
        continue-on-error: true
        run: |
          black --check --diff fix_analysis.py quality_metrics_extension.py test_fix_analysis.py

      - name: Lint with flake8 (critical errors only)
        run: |
          flake8 fix_analysis.py quality_metrics_extension.py test_fix_analysis.py --count --select=E9,F63,F7,F82 --show-source --statistics --exit-zero

      - name: Extended linting with flake8
        continue-on-error: true
        run: |
          flake8 fix_analysis.py quality_metrics_extension.py test_fix_analysis.py --count --max-complexity=15 --max-line-length=127 --statistics --exit-zero

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib seaborn || true

      - name: Verify CodeShovel JAR exists
        continue-on-error: true
        run: |
          if [ -f "codeshovel.jar" ]; then
            echo "✓ CodeShovel JAR found"
            ls -lh codeshovel.jar
          else
            echo " CodeShovel JAR not found (expected for CI)"
          fi

      - name: Test CLI help
        continue-on-error: true
        run: |
          python fix_analysis.py --help 2>&1 | head -20 || echo "CLI help not available (expected without full setup)"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Check for known vulnerabilities in dependencies
        continue-on-error: true
        run: |
          pip install -r requirements-test.txt
          safety check --ignore 70612 || echo "Safety check completed with warnings"

      - name: Run Bandit security scanner
        continue-on-error: true
        run: |
          bandit -r fix_analysis.py quality_metrics_extension.py -ll -f json -o bandit-report.json || true
          if [ -f "bandit-report.json" ]; then
            echo "Security scan completed"
            cat bandit-report.json | head -50
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
          if-no-files-found: ignore
